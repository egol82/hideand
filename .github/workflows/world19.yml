name: Seven-map world finish
on:
  push:
    branches: ['phase19/world-finish']
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: python tools/install_godot15.py
      - name: Preserve native assets and run actual seven-map tests
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,sys
          for manifest in ['assets/character13/manifest.json','assets/lighting15/manifest.json']:
              for name,digest in json.loads(pathlib.Path(manifest).read_text()).items():
                  assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run([sys.executable,'tools/test_world19.py','--matches'],check=True)
      - name: Prior integration suites
        shell: python
        run: |
          import subprocess,sys
          for name in ['hideplay','premium','material14','lighting15','animation16','environment17','feel18']:
              subprocess.run([sys.executable,'tools/test_'+name+'.py'],check=True,timeout=600)
          subprocess.run([sys.executable,'tools/verify_project.py'],check=True)
      - name: Real rendering and exact source
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          xvfb-run -a python tools/test_world19.py --capture
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase19_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/world19-source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world19-${{ runner.os }}
          path: ci-artifacts/
          retention-days: 7
