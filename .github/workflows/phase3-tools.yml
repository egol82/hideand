name: Phase 3 validation tools
on:
  push:
    branches: ['phase3/first-person-maps']
    paths: ['.github/workflows/phase3-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official checksum-verified engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-tools
          cd engine-tools
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          NAME=Godot_v4.4.1-stable_linux.x86_64.zip
          curl --fail --location --retry 2 "$BASE/$NAME" -o "$NAME"
          curl --fail --location --retry 2 "$BASE/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F "$NAME" SHA512-SUMS.txt | sha512sum --check --strict
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-checksummed-engine
          path: engine-tools/
          retention-days: 1
