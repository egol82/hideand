name: Phase21 first step - Pine interactions
on:
  push:
    branches: ['phase21/living-nature']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pine21-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: python tools/install_godot15.py
      - name: Original character and manor GI manifests
        shell: python
        run: |
          import hashlib,json,pathlib
          for manifest in ['assets/character13/manifest.json','assets/lighting15/manifest.json']:
              for name,digest in json.loads(pathlib.Path(manifest).read_text()).items():
                  assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
      - name: Focused Pine mechanics, unchanged sync and all ten maps in both modes
        run: python tools/test_pine21.py --matches
      - name: Affected hiding and map-registry regressions
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'tools/test_hideplay.py'],check=True)
          subprocess.run([sys.executable,'tools/test_maps.py','--skip-matches'],check=True)
          subprocess.run([sys.executable,'tools/test_outdoor20.py','--skip-import'],check=True)
          subprocess.run([sys.executable,'tools/verify_project.py'],check=True)
      - name: Actual renderer evidence
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          xvfb-run -a python tools/test_pine21.py --skip-import --capture
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase21A_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/pine21-commit.txt
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pine21-${{ runner.os }}
          path: ci-artifacts/
          retention-days: 7
