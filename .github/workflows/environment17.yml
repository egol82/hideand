name: Crafted manor environment
on:
  push:
    branches: ['phase17/crafted-manor']
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: environment17-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: python tools/install_godot15.py
      - name: Preserve original character and GI hashes
        shell: python
        run: |
          import hashlib,json,pathlib
          for manifest in ['assets/character13/manifest.json','assets/lighting15/manifest.json']:
              for name,digest in json.loads(pathlib.Path(manifest).read_text()).items():
                  assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
      - name: Geometry, hide-site clearance, native export, actual contact and fourteen matches
        run: python tools/test_environment17.py --matches
      - name: Preserve every inherited engine regression
        shell: python
        run: |
          import os,pathlib,subprocess,sys
          for name in ['phase4','quality','graphics','maps','grip','smash','sync','studio','hideplay','premium','character13','material14','lighting15','animation16']:
              r=subprocess.run([sys.executable,'tools/test_'+name+'.py'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=600)
              text=r.stdout+r.stderr;pathlib.Path('ci-artifacts/environment17-prior-'+name+'.log').write_text(text,encoding='utf-8');print(text,flush=True)
              if r.returncode:sys.exit(r.returncode)
          scripts=['tools/test.ps1','tools/test_phase3.ps1'] if os.name=='nt' else ['tools/test.sh','tools/test_phase3.sh']
          for script in scripts:
              cmd=['pwsh','-File',script,'-Godot',os.environ['GODOT_BIN']] if os.name=='nt' else ['bash',script]
              subprocess.run(cmd,check=True,timeout=600)
          subprocess.run([sys.executable,'tools/verify_project.py'],check=True)
      - name: Real same-light manor before and after captures
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          xvfb-run -a python tools/test_environment17.py --capture
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase17_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/environment17-source-commit.txt
          cp -r assets/environment17/generated ci-artifacts/environment17-native
      - name: Save exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment17-${{ runner.os }}
          path: ci-artifacts/
          retention-days: 7
