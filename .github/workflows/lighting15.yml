name: Live manor LightmapGI
on:
  push:
    branches: ['phase15/manor-lighting-gi']
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lighting15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    if: github.ref == 'refs/heads/phase15/manor-lighting-gi'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    outputs:
      source: ${{ steps.publish.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/install_godot15.py
      - name: Restore exact completed bake when it is not yet tracked
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          if test -s assets/lighting15/manifest.json; then
            python - <<'PY'
          import hashlib,json,pathlib
          for name,digest in json.loads(pathlib.Path('assets/lighting15/manifest.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          print('Existing committed bake hash check passed')
          PY
          else
            gh api repos/egol82/hideand/actions/artifacts/11043751095/zip > "$RUNNER_TEMP/manor-original-bake.zip"
            python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'manor-original-bake.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='c1e27c2e3d28642dff297b6be9da2b85d47b157da1d8ee9e6af89c52d2c1635a'
          with zipfile.ZipFile(p) as z:
              status=json.loads(z.read('ci-artifacts/lighting15-bake.json'))
              assert status['baked'] and status['users']==326
              for name in z.namelist():
                  target=pathlib.Path(name)
                  if name.startswith('assets/lighting15/') and target.suffix in ['.scn','.lmbake','.exr','.import']:
                      target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(z.read(name))
                  elif name.startswith('ci-artifacts/'):
                      target=pathlib.Path('ci-artifacts/recovered-bake')/target.name
                      target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(name))
          print('Recovered real bake from run36588371682; its editor-finalize error remains recorded, not reclassified as success')
          PY
          fi
      - name: Preserve candidate snapshot before validation
        shell: python
        run: |
          import pathlib,subprocess,zipfile
          root=pathlib.Path('.')
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          names=set(n for n in tracked if n)
          names.update(str(p) for p in (root/'assets/lighting15').glob('*') if p.is_file())
          with zipfile.ZipFile('ci-artifacts/lighting15-candidate.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):z.write(name,name)
              z.comment=subprocess.check_output(['git','rev-parse','HEAD']).strip()
      - name: Publish candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lighting15-candidate
          path: ci-artifacts/
          retention-days: 7
      - name: Require clean live import, resolved lightmap users, geometry signature and contact tests
        run: python tools/test_lighting15.py
      - name: Publish validated native GI resources on this feature branch only
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,hashlib,json
          names=[str(p) for p in pathlib.Path('assets/lighting15').glob('*') if p.suffix in ['.scn','.lmbake','.exr','.import']]
          names+=['scripts/lighting15/build_room.gd','scripts/hideplay/manor.gd','scripts/phase4/art.gd','shaders/material14/toy_v2.gdshader']
          data={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in sorted(names)}
          pathlib.Path('assets/lighting15/manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          test "$(git ls-remote origin refs/heads/phase15/manor-lighting-gi | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lighting15
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish recovered and live-validated native manor lightmaps and probes [skip ci]'
            git push origin HEAD:refs/heads/phase15/manor-lighting-gi
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase15_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/lighting15-source-commit.txt
      - name: Save asset validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting15-assets
          path: ci-artifacts/
          retention-days: 7
  verify:
    needs: assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assets.outputs.source }}
      - run: python tools/install_godot15.py
      - name: Verify baked data hashes, actual game integration and fourteen matches
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,sys
          for name,digest in json.loads(pathlib.Path('assets/lighting15/manifest.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run([sys.executable,'tools/test_lighting15.py','--matches'],check=True)
      - name: Preserve existing core and Python-driven engine tests
        shell: python
        run: |
          import os,subprocess,sys
          for runner in ['phase4','quality','graphics','maps','grip','smash','sync','studio','hideplay','premium','character13','material14']:
              subprocess.run([sys.executable,'tools/test_'+runner+'.py'],check=True)
          if os.name=='nt':
              for script in ['tools/test.ps1','tools/test_phase3.ps1']:
                  subprocess.run(['pwsh','-File',script,'-Godot',os.environ['GODOT_BIN']],check=True)
          else:
              for script in ['tools/test.sh','tools/test_phase3.sh']:subprocess.run(['bash',script],check=True)
          subprocess.run([sys.executable,'tools/verify_project.py'],check=True)
      - name: Render empty room, GI comparisons and isolated dynamic probe response
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          xvfb-run -a python tools/test_lighting15.py --capture
          grep -q LIGHTING15_RENDER_PASS ci-artifacts/lighting15-render.log
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase15_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/lighting15-source-commit.txt
      - name: Save exact source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting15-${{ runner.os }}
          path: ci-artifacts/
          retention-days: 7
