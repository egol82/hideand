name: Connected skinned character
on:
  push:
    branches: ['phase13/skinned-character']
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    if: github.ref == 'refs/heads/phase13/skinned-character'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source: ${{ steps.save.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified Godot
        shell: python
        run: |
          import hashlib,os,pathlib,urllib.request,zipfile
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'char-godot';folder.mkdir(exist_ok=True)
          name='Godot_v4.4.1-stable_linux.x86_64.zip'
          base='https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/'
          archive=folder/name;urllib.request.urlretrieve(base+name,archive)
          lines=urllib.request.urlopen(base+'SHA512-SUMS.txt').read().decode().splitlines()
          expected=[line.split()[0] for line in lines if line.endswith(name)]
          assert len(expected)==1 and hashlib.sha512(archive.read_bytes()).hexdigest()==expected[0].lower()
          with zipfile.ZipFile(archive) as z:z.extractall(folder)
          exe=next(folder.glob('*.x86_64'));exe.chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GODOT_BIN='+str(exe)+'\n')
      - name: Build and save native model on this feature branch only
        id: save
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          "$GODOT_BIN" --headless --path . --script res://tools/build_character13.gd 2>&1 | tee ci-artifacts/character-build.log
          grep -q CHARACTER_BUILD_PASS ci-artifacts/character-build.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' ci-artifacts/character-build.log; then exit 1; fi
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          names=['assets/character13/buddy_body.res','assets/character13/buddy_rig.scn','scripts/character13/mesh_builder.gd','scripts/character13/avatar.gd']
          data={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names}
          pathlib.Path('assets/character13/manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          test "$(git ls-remote origin refs/heads/phase13/skinned-character | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/character13/buddy_body.res assets/character13/buddy_rig.scn assets/character13/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: save native connected character mesh and editable rig [skip ci]'
            git push origin HEAD:refs/heads/phase13/skinned-character
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assets.outputs.source }}
      - name: Install checksum-verified Godot
        shell: python
        run: |
          import hashlib,os,pathlib,urllib.request,zipfile
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'char-godot';folder.mkdir(exist_ok=True)
          plat='win64.exe' if os.name=='nt' else 'linux.x86_64'
          name='Godot_v4.4.1-stable_'+plat+'.zip'
          base='https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/'
          archive=folder/name;urllib.request.urlretrieve(base+name,archive)
          lines=urllib.request.urlopen(base+'SHA512-SUMS.txt').read().decode().splitlines()
          expected=[line.split()[0] for line in lines if line.endswith(name)]
          assert len(expected)==1 and hashlib.sha512(archive.read_bytes()).hexdigest()==expected[0].lower()
          with zipfile.ZipFile(archive) as z:z.extractall(folder)
          exe=next(folder.glob('*_console.exe' if os.name=='nt' else '*.x86_64'))
          if os.name!='nt':exe.chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('GODOT_BIN='+str(exe)+'\n')
      - name: Verify exact asset/source hashes and new skin, contact and fourteen matches
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,sys
          for name,digest in json.loads(pathlib.Path('assets/character13/manifest.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run([sys.executable,'tools/test_character13.py','--matches'],check=True)
      - name: Preserve all previous Python-driven suites
        shell: python
        run: |
          import subprocess,sys
          for runner in ['phase4','quality','graphics','maps','grip','smash','sync','studio','hideplay','premium']:
              subprocess.run([sys.executable,'tools/test_'+runner+'.py'],check=True)
      - name: Original core suites on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/test.sh
          bash tools/test_phase3.sh
          python tools/verify_project.py
      - name: Original core suites on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./tools/test.ps1 -Godot $env:GODOT_BIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tools/test_phase3.ps1 -Godot $env:GODOT_BIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_project.py
      - name: Actual model and gameplay renders
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk ffmpeg
          xvfb-run -a python tools/test_character13.py --capture
          ffmpeg -y -framerate 30 -i ci-artifacts/character13_frames/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart ci-artifacts/character13_turntable.mp4
          rm -rf ci-artifacts/character13_frames
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase13_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/character-source-commit.txt
      - name: Save exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character13-${{ runner.os }}
          path: ci-artifacts/
          retention-days: 7
