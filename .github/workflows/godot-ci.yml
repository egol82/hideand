name: Godot validation
on:
  push:
    branches: [main, 'phase2/**', 'phase3/**', 'phase4/**', 'phase5/**', 'phase6/**', 'phase7/**', 'phase8/**', 'phase9/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        godot: ['4.4.1', '4.7.2']
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot build
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ matrix.godot }}'
          NAME="Godot_v${VERSION}-stable_linux.x86_64.zip"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot" ci-artifacts
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 2 "$BASE/$NAME" -o "$NAME"
          curl --fail --location --retry 2 "$BASE/SHA512-SUMS.txt" -o sums.txt
          grep -F "$NAME" sums.txt | sha512sum --check --strict
          unzip -q "$NAME"
          chmod +x "Godot_v${VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Validate source package
        run: python3 tools/verify_project.py
      - name: Import, unit tests, input tests, scene checks and full bot match
        shell: bash
        run: |
          set -o pipefail
          bash tools/test.sh 2>&1 | tee ci-artifacts/godot-tests.log
      - name: First-person assertions and full matches on all three maps
        shell: bash
        run: |
          set -o pipefail
          bash tools/test_phase3.sh 2>&1 | tee ci-artifacts/phase3-tests.log
      - name: Phase 4 audit regressions and both modes on all maps
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_phase4.py 2>&1 | tee ci-artifacts/phase4-suite.log
      - name: Practice, remapping, recovery and next-round workshop tests
        run: python3 tools/test_quality.py
      - name: Graphics invariants and new entry
        run: python3 tools/test_graphics.py
      - name: New map connectivity, sound routes and six complete matches
        run: python3 tools/test_maps.py
      - name: Natural grip and presentation-isolation regressions
        run: python3 tools/test_grip.py
      - name: Smash presentation and actual entry
        run: python3 tools/test_smash.py --matches
      - name: Render smash reactions and export preview
        if: matrix.godot == '4.7.2' && startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg
          timeout 400s xvfb-run -a python3 tools/test_smash.py --capture --video | tee ci-artifacts/smash-capture-suite.log
          ffmpeg -hide_banner -loglevel error -framerate 30 -i ci-artifacts/smash_frames/%04d.png -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart ci-artifacts/phase9_smash_demo.mp4
          rm -rf ci-artifacts/smash_frames
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase9_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/phase9-source-commit.txt
      - name: Render natural grip in all new maps and attack stages
        if: matrix.godot == '4.7.2' && !startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          timeout 280s xvfb-run -a python3 tools/test_grip.py --capture 2>&1 | tee ci-artifacts/grip-capture-suite.log
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase8_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/phase8-source-commit.txt
      - name: Render Korean and English playability screens
        if: matrix.godot == '4.7.2' && !startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          timeout 150s xvfb-run -a python3 tools/test_quality.py --capture 2>&1 | tee ci-artifacts/quality-capture-suite.log
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase5_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/phase5-source-commit.txt
      - name: Render Phase 6 graphics evidence
        if: matrix.godot == '4.7.2' && !startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 240s xvfb-run -a python3 tools/test_graphics.py --capture 2>&1 | tee ci-artifacts/graphics-capture-suite.log
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase6_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/phase6-source-commit.txt
      - name: Render Phase 7 map pack
        if: matrix.godot == '4.7.2' && !startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 300s xvfb-run -a python3 tools/test_maps.py --capture --skip-matches 2>&1 | tee ci-artifacts/map-pack-capture-suite.log
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase7_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/phase7-source-commit.txt
      - name: Capture Phase 4 real game screens
        if: matrix.godot == '4.7.2' && !startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a python3 tools/test_phase4.py --skip-matches --capture 2>&1 | tee ci-artifacts/phase4-render-suite.log
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase4_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/phase4-source-commit.txt
      - name: Capture preserved Phase 2 game screens
        if: matrix.godot == '4.7.2' && !startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 90s xvfb-run -a "$GODOT_BIN" --path . --audio-driver Dummy --rendering-method gl_compatibility res://scenes/phase2.tscn -- --capture-phase2 --seed=8027 2>&1 | tee ci-artifacts/render.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|FAIL:' ci-artifacts/render.log; then
            echo 'Engine error found in rendered capture.' >&2
            exit 1
          fi
          grep -Fq PHASE2_SMOKE_READY ci-artifacts/render.log
          for screen in 01_drawing 02_seeking 03_reveal 04_duel 05_result; do
            test -s "ci-artifacts/$screen.png"
          done
      - name: Capture real first-person screens
        if: matrix.godot == '4.7.2' && !startsWith(github.head_ref || github.ref_name, 'phase9/')
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 90s xvfb-run -a "$GODOT_BIN" --path . --audio-driver Dummy --rendering-method gl_compatibility res://scenes/phase3.tscn -- --capture-phase3 2>&1 | tee ci-artifacts/phase3-render.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|FAIL:' ci-artifacts/phase3-render.log; then
            echo 'Engine error in first-person render capture.' >&2
            exit 1
          fi
          grep -Fq PHASE3_SMOKE_READY ci-artifacts/phase3-render.log
          for screen in phase3_00_map_menu phase3_01_drawing phase3_toy_home_fps phase3_02_reveal phase3_03_swing phase3_warehouse_fps phase3_garden_fps; do
            test -s "ci-artifacts/$screen.png"
          done
          git archive --format=zip --output=ci-artifacts/HideAndSmashing_Phase3_Source.zip HEAD
          git rev-parse HEAD > ci-artifacts/source-commit.txt
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.godot }}-validation
          path: |
            ci-artifacts/
            docs/offline_check_report.json
          if-no-files-found: ignore
          retention-days: 7
  windows:
    name: Windows headless validation (4.7.2)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified official Windows Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          $name = 'Godot_v4.7.2-stable_win64.exe.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $archive = Join-Path $folder $name
          $sumPath = Join-Path $folder 'SHA512-SUMS.txt'
          Invoke-WebRequest "$base/$name" -OutFile $archive
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile $sumPath
          $line = @(Get-Content -LiteralPath $sumPath | Where-Object { $_ -match ([regex]::Escape($name) + '\s*$') })
          if ($line.Count -ne 1) { throw 'Missing unique checksum entry' }
          $expected = ($line[0].Trim() -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA512).Hash -ne $expected) { throw 'Checksum mismatch' }
          Expand-Archive $archive -DestinationPath $folder
          $exe = Get-ChildItem $folder -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Console executable missing' }
          "GODOT_BIN=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Run engine tests on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          python tools/verify_project.py
          & ./tools/test.ps1 -Godot $env:GODOT_BIN *>&1 | Tee-Object ci-artifacts/windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: First-person and three-map engine tests on Windows
        shell: pwsh
        run: |
          & ./tools/test_phase3.ps1 -Godot $env:GODOT_BIN *>&1 | Tee-Object ci-artifacts/windows-phase3-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Phase 4 audit regressions and six complete matches on Windows
        shell: pwsh
        run: |
          python tools/test_phase4.py *>&1 | Tee-Object ci-artifacts/windows-phase4-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Practice, remapping, recovery and workshop checks on Windows
        shell: pwsh
        run: |
          python tools/test_quality.py *>&1 | Tee-Object ci-artifacts/windows-quality-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Graphics invariants and new entry on Windows
        shell: pwsh
        run: |
          python tools/test_graphics.py *>&1 | Tee-Object ci-artifacts/windows-graphics-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: New map connectivity, sound routes and six complete matches on Windows
        shell: pwsh
        run: |
          python tools/test_maps.py *>&1 | Tee-Object ci-artifacts/windows-map-pack.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Natural grip and presentation-isolation regressions on Windows
        shell: pwsh
        run: |
          python tools/test_grip.py *>&1 | Tee-Object ci-artifacts/windows-grip-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smash presentation and all mode-map matches on Windows
        shell: pwsh
        run: |
          python tools/test_smash.py --matches *>&1 | Tee-Object ci-artifacts/windows-smash-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-windows-4.7.2-validation
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
